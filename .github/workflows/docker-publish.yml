name: docker-publish

on:
  push:
    branches: [ main ]
    paths: [ "Dockerfile", "app.py", "repodoctor/**", "prompts/**", "requirements.txt" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch buildx plugin for the app image
        run: |-
          mkdir -p cli-plugins
          curl -fsSL "https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64" \
            -o cli-plugins/docker-buildx
          chmod +x cli-plugins/docker-buildx

      - name: Set lower-case image name
        id: img
        run: echo "name=ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            latest
            ${{ github.ref_name == 'main' && '0.1.0' || github.ref_name }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
