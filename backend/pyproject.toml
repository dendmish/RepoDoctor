[project]
name = "repodoctor"
version = "0.1.0"
description = "RepoDoctor: analysis and launch guidance for public GitHub repositories"
requires-python = ">=3.12,<3.13"
# Exact versions are fixed at G0 (see docs/decisions.md). Change only through agent 1.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "httpx==0.28.1",
    "openai==3.37.0",
    "packaging==26.3",
]

[dependency-groups]
dev = [
    "editables==0.6",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repodoctor"]
# Editable install via import hook: plain .pth paths break on non-ASCII project paths
# under Python 3.12 on Windows (site.py decodes .pth with the locale encoding).
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/repodoctor/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and synthetic secrets in tests
